name: City24 watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Write config.yaml from secrets (3 locations)
        run: |
          cat > config.yaml <<'EOF'
          telegram:
            bot_token: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            chat_id: "${{ secrets.TELEGRAM_CHAT_ID }}"
          message:
            max_per_run: 10
          filters:
            min_price: null
            max_price: null
          search_urls:
            - "${{ secrets.CITY24_SEARCH_URL_1 }}"
            - "${{ secrets.CITY24_SEARCH_URL_2 }}"
            - "${{ secrets.CITY24_SEARCH_URL_3 }}"
          EOF

      - name: Telegram smoke test
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ City24 watcher started"

      - name: Run watcher
        run: python check_city24.py
